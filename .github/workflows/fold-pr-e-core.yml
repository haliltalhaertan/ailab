name: fold-pr-e-core

on:
  push:
    branches: [feat/completion-reasoning-robustness]

permissions:
  contents: write

jobs:
  fold:
    if: contains(github.event.head_commit.message, '[fold-pr-e-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/completion-reasoning-robustness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fold recovery and telemetry into core classes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          ROOT = Path('.')

          def node_text(source: str, node: ast.AST) -> str:
              lines = source.splitlines(keepends=True)
              assert getattr(node, 'lineno', None) is not None
              assert getattr(node, 'end_lineno', None) is not None
              return ''.join(lines[node.lineno - 1: node.end_lineno]).rstrip('\n')

          def class_method(source: str, class_name: str, method_name: str) -> str:
              tree = ast.parse(source)
              cls = next(
                  node for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == class_name
              )
              method = next(
                  node for node in cls.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == method_name
              )
              return node_text(source, method)

          def replace_methods(source: str, class_name: str, replacements: dict[str, str]) -> str:
              tree = ast.parse(source)
              cls = next(
                  node for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == class_name
              )
              lines = source.splitlines(keepends=True)
              offsets = [0]
              for line in lines:
                  offsets.append(offsets[-1] + len(line))
              spans = []
              for node in cls.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in replacements:
                      start = offsets[node.lineno - 1]
                      end = offsets[node.end_lineno]
                      spans.append((start, end, replacements[node.name]))
              present = {
                  node.name for node in cls.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in replacements
              }
              if set(replacements) != present:
                  missing = set(replacements) - present
                  raise RuntimeError(f'missing methods in {class_name}: {sorted(missing)}')
              for start, end, replacement in sorted(spans, reverse=True):
                  source = source[:start] + replacement.rstrip('\n') + '\n' + source[end:]
              return source

          recovery_path = ROOT / 'lab/theorem_recovery.py'
          engine_path = ROOT / 'lab/theorem_engine.py'
          recovery = recovery_path.read_text(encoding='utf-8')
          engine = engine_path.read_text(encoding='utf-8')

          recovery_tree = ast.parse(recovery)
          retry_assign = next(
              node for node in recovery_tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '_RETRY_INSTRUCTION' for target in node.targets)
          )
          helper_names = [
              '_is_truncated_empty_record',
              '_response_meta',
              '_cached_meta',
              '_retry_event_payload',
          ]
          helper_nodes = [
              next(node for node in recovery_tree.body if isinstance(node, ast.FunctionDef) and node.name == name)
              for name in helper_names
          ]
          helper_block = '\n\n'.join(
              [node_text(recovery, retry_assign)] + [node_text(recovery, node) for node in helper_nodes]
          )

          integrated_call = '\n\n'.join(
              class_method(recovery, 'TheoremResearchLab', name)
              for name in (
                  '_load_cached_llm_step',
                  '_call',
                  '_parse_truncated_prefix',
                  '_retry_truncated_json',
              )
          )
          integrated_call_json = class_method(recovery, 'TheoremResearchLab', '_call_json')
          engine = replace_methods(
              engine,
              'TheoremResearchLab',
              {'_call': integrated_call, '_call_json': integrated_call_json},
          )
          if 'from lab.client import next_lower_supported_effort\n' not in engine:
              engine = engine.replace(
                  'from lab.agent import Agent\n',
                  'from lab.agent import Agent\nfrom lab.client import next_lower_supported_effort\n',
                  1,
              )
          marker = '@dataclass\nclass IterationOutcome:'
          if marker not in engine:
              raise RuntimeError('IterationOutcome insertion marker not found')
          if '_RETRY_INSTRUCTION = (' not in engine:
              engine = engine.replace(marker, helper_block + '\n\n\n' + marker, 1)
          ast.parse(engine)
          engine_path.write_text(engine, encoding='utf-8')

          completion_path = ROOT / 'lab/trace_completion.py'
          trace_path = ROOT / 'lab/trace.py'
          completion = completion_path.read_text(encoding='utf-8')
          trace = trace_path.read_text(encoding='utf-8')
          trace = replace_methods(
              trace,
              'Trace',
              {
                  '_auto_stage_end_for_llm_call': class_method(completion, 'Trace', '_auto_stage_end_for_llm_call'),
                  'agent_call': class_method(completion, 'Trace', 'agent_call'),
              },
          )
          retry_label_marker = '        if key.endswith(":json_repair"):\n'
          retry_label = (
              '        match = re.fullmatch(r"iter:(\\d+):proposer:truncated_retry", key)\n'
              '        if match:\n'
              '            return f"Tur {match.group(1)} · Theorist · öneri (kesilme sonrası tekrar)"\n'
          )
          if 'öneri (kesilme sonrası tekrar)' not in trace:
              if retry_label_marker not in trace:
                  raise RuntimeError('trace label insertion marker not found')
              trace = trace.replace(retry_label_marker, retry_label + retry_label_marker, 1)
          ast.parse(trace)
          trace_path.write_text(trace, encoding='utf-8')

          replacements = {
              'from lab.theorem_recovery import TheoremResearchLab': 'from lab.theorem_engine import TheoremResearchLab',
              'from lab.trace_completion import Trace': 'from lab.trace import Trace',
              'lab.theorem_recovery.next_lower_supported_effort': 'lab.theorem_engine.next_lower_supported_effort',
          }
          for path in ROOT.rglob('*.py'):
              if path in {recovery_path, completion_path}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          recovery_path.unlink()
          completion_path.unlink()

          leftovers = []
          for path in ROOT.rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              if 'theorem_recovery' in text or 'trace_completion' in text:
                  leftovers.append(str(path))
          if leftovers:
              raise RuntimeError(f'shim references remain: {leftovers}')

          # Syntax-level validation before dependency installation.
          ast.parse(engine_path.read_text(encoding='utf-8'))
          ast.parse(trace_path.read_text(encoding='utf-8'))
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Core identity smoke
        shell: bash
        run: |
          python - <<'PY'
          import lab
          from lab.theorem_engine import TheoremResearchLab as EngineLab
          from lab.trace import Trace as CoreTrace
          assert lab.TheoremResearchLab is EngineLab
          assert lab.Trace is CoreTrace
          assert CoreTrace._theorem_stage_label('iter:2:proposer:truncated_retry', 'Theorist') == (
              'Tur 2 · Theorist · öneri (kesilme sonrası tekrar)'
          )
          PY
      - name: Focused recovery tests
        run: python -m pytest tests/test_completion_recovery.py tests/test_budget_telemetry.py tests/test_ui_live_cards.py -q -p no:cacheprovider
      - name: Full offline suite
        run: python -m pytest tests -q -p no:cacheprovider -k 'not container_integration'
      - name: Ruff
        run: python -m ruff check lab tests app.py pages experiments
      - name: Mypy
        run: python -m mypy lab
      - name: Commit folded core and remove bootstrap workflow
        shell: bash
        run: |
          rm -f .github/workflows/fold-pr-e-core.yml
          git config user.name 'ailab-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fold completion recovery into core classes'
          git push origin HEAD:feat/completion-reasoning-robustness
