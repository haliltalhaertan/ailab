name: live-baseline-probe

on:
  push:
    branches: ["baseline-live-probe"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LAB_BASELINE_MODEL: ${{ vars.LAB_BASELINE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify live API secret exists
        run: test -n "$OPENROUTER_API_KEY"
      - name: Run two-iteration live baseline
        run: python experiments/live_baseline_probe.py
      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-baseline-artifacts
          path: baseline_artifacts/
          if-no-files-found: warn
