name: apply-evidence-core

on:
  push:
    branches:
      - feat/evidence-driven-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire evidence into tools, guard, and theorem run
        run: |
          python - <<'PY'
          from pathlib import Path

          tools_path = Path("lab/tools.py")
          tools = tools_path.read_text(encoding="utf-8")
          if "import ast\n" not in tools:
              tools = tools.replace("from __future__ import annotations\n\n", "from __future__ import annotations\n\nimport ast\n", 1)
          if "import time\n" not in tools:
              tools = tools.replace("import sys\n", "import sys\nimport time\n", 1)
          marker = '''    def as_dict(self) -> dict[str, Any]:\n        return {\n            "ok": self.ok,\n            "tool": self.tool,\n            "output": self.output,\n            "error": self.error,\n            "metadata": self.metadata,\n        }\n'''
          replacement = marker + '''\n    def as_evidence(\n        self,\n        *,\n        request: dict[str, Any] | None = None,\n        contract=None,\n        target_id: str | None = None,\n    ):\n        from lab.evidence import evidence_from_tool_result\n\n        return evidence_from_tool_result(\n            self, request=request, contract=contract, target_id=target_id\n        )\n'''
          if "def as_evidence(" not in tools:
              if marker not in tools:
                  raise SystemExit("ToolResult.as_dict anchor missing")
              tools = tools.replace(marker, replacement, 1)

          start = tools.index("class ScriptTool:")
          end = tools.index("\n\nclass Z3Tool:", start)
          script_class = '''class ScriptTool:\n    """Runs only checked-in research scripts; static AST policy caps evidence."""\n\n    def __init__(self, root: str | Path = "research_tools", timeout_s: int = 30):\n        self.root = Path(root).resolve()\n        self.timeout_s = int(timeout_s)\n\n    def _resolve(self, name: str) -> Path:\n        candidate = (self.root / name).resolve()\n        try:\n            candidate.relative_to(self.root)\n        except ValueError as exc:\n            raise ValueError("Script path research_tools dışına çıkamaz.") from exc\n        if candidate.suffix != ".py":\n            raise ValueError("Yalnızca .py araştırma scriptleri çalıştırılabilir.")\n        if not candidate.is_file():\n            raise FileNotFoundError(candidate)\n        return candidate\n\n    @staticmethod\n    def _literal_assignment(tree: ast.Module, name: str):\n        for node in tree.body:\n            if not isinstance(node, (ast.Assign, ast.AnnAssign)):\n                continue\n            targets = node.targets if isinstance(node, ast.Assign) else [node.target]\n            if not any(isinstance(target, ast.Name) and target.id == name for target in targets):\n                continue\n            value = node.value\n            if value is None:\n                return None\n            try:\n                return ast.literal_eval(value)\n            except (ValueError, TypeError):\n                return None\n        return None\n\n    @classmethod\n    def _policy(cls, script: Path) -> dict[str, Any]:\n        try:\n            tree = ast.parse(script.read_text(encoding="utf-8"), filename=str(script))\n        except (OSError, SyntaxError):\n            return {\n                "allowed_evidence_kinds": ["INCONCLUSIVE"],\n                "accepts_specification": False,\n                "evidence_role": "GENERAL",\n                "policy_error": "static declarations could not be parsed",\n            }\n        raw_allowed = cls._literal_assignment(tree, "AILAB_ALLOWED_EVIDENCE_KINDS")\n        allowed = (\n            {str(value).upper() for value in raw_allowed}\n            if isinstance(raw_allowed, (list, tuple, set))\n            else {"NUMERICAL_PASS", "INCONCLUSIVE"}\n        )\n        accepts_specification = cls._literal_assignment(tree, "AILAB_ACCEPTS_SPECIFICATION") is True\n        role = str(cls._literal_assignment(tree, "AILAB_EVIDENCE_ROLE") or "GENERAL").upper()\n        policy_error = ""\n        if "FORMAL_PROOF" in allowed:\n            allowed = {"INCONCLUSIVE"}\n            policy_error = "checked-in scripts cannot self-declare FORMAL_PROOF"\n        if accepts_specification:\n            allowed &= {"SOLVER_RESULT", "NUMERICAL_PASS", "INCONCLUSIVE"}\n        allowed.add("INCONCLUSIVE")\n        if role not in {"SEARCH_CERTIFICATE", "INDEPENDENT_CHECKER", "GENERAL"}:\n            role = "GENERAL"\n        return {\n            "allowed_evidence_kinds": sorted(allowed),\n            "accepts_specification": accepts_specification,\n            "evidence_role": role,\n            "policy_error": policy_error,\n        }\n\n    @staticmethod\n    def _payload(stdout: str) -> dict[str, Any] | None:\n        lines = [line.strip() for line in stdout.splitlines() if line.strip()]\n        if not lines:\n            return None\n        try:\n            payload = json.loads(lines[-1])\n        except json.JSONDecodeError:\n            return None\n        return dict(payload) if isinstance(payload, dict) else None\n\n    def run(self, name: str, args: list[str] | None = None) -> ToolResult:\n        started = time.monotonic()\n        try:\n            script = self._resolve(name)\n        except Exception as exc:\n            return ToolResult(False, "script", error=str(exc), metadata={"runtime_s": time.monotonic() - started})\n        policy = self._policy(script)\n        env = {"PATH": os.environ.get("PATH", ""), "PYTHONIOENCODING": "utf-8"}\n        try:\n            proc = subprocess.run(\n                [sys.executable, "-I", str(script), *(args or [])],\n                cwd=str(self.root),\n                env=env,\n                text=True,\n                capture_output=True,\n                timeout=self.timeout_s,\n                check=False,\n            )\n        except subprocess.TimeoutExpired as exc:\n            return ToolResult(\n                False,\n                "script",\n                error=f"timeout ({self.timeout_s}s): {exc}",\n                metadata={\n                    **policy,\n                    "script": name,\n                    "args": args or [],\n                    "script_sha256": sha256_file(script),\n                    "runtime_s": time.monotonic() - started,\n                },\n            )\n        payload = self._payload(proc.stdout)\n        metadata = {\n            **policy,\n            "returncode": proc.returncode,\n            "script": name,\n            "args": args or [],\n            "script_sha256": sha256_file(script),\n            "runtime_s": time.monotonic() - started,\n        }\n        if payload is not None:\n            metadata["evidence_payload"] = payload\n        return ToolResult(\n            proc.returncode == 0,\n            "script",\n            output=proc.stdout.strip(),\n            error=proc.stderr.strip(),\n            metadata=metadata,\n        )\n'''
          tools = tools[:start] + script_class + tools[end:]
          tools_path.write_text(tools, encoding="utf-8")

          guard_path = Path("lab/status_guard.py")
          guard = '''from __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Any\n\nfrom lab.evidence import Evidence, evidence_from_tool_result, validate_evidence_binding\nfrom lab.research_contract import ResearchContract\nfrom lab.tools import ToolResult\n\n\n@dataclass(frozen=True)\nclass GuardDecision:\n    requested: str\n    granted: str\n    reason: str\n    downgraded: bool\n    metadata: dict[str, Any]\n\n\ndef choose_status(\n    requested: str,\n    *,\n    tool_result: ToolResult | None,\n    verifier: dict[str, Any],\n    critic: dict[str, Any],\n    expected_item_id: str | None = None,\n    expected_iteration: int | None = None,\n    expected_claim_hash: str | None = None,\n    evidence: Evidence | None = None,\n    contract: ResearchContract | None = None,\n) -> GuardDecision:\n    """Return the strongest status justified by machine-observable evidence."""\n\n    requested = str(requested or "OPEN").upper()\n    verifier_verdict = str(verifier.get("verdict") or "INCONCLUSIVE").upper()\n    critic_verdict = str(critic.get("verdict") or "REVISE").upper()\n    tmeta = dict((tool_result.metadata if tool_result else None) or {})\n    bound_evidence = evidence\n    if bound_evidence is None and tool_result is not None:\n        bound_evidence = evidence_from_tool_result(tool_result, contract=contract)\n    if bound_evidence is not None:\n        bound_evidence = validate_evidence_binding(bound_evidence, contract=contract)\n\n    claim_hash_matches = bool(\n        expected_claim_hash\n        and str(tmeta.get("claim_hash") or "") == str(expected_claim_hash)\n    )\n    formal_verified = bool(\n        tool_result\n        and tool_result.ok\n        and tool_result.tool == "lean"\n        and tmeta.get("formal_verified") is True\n        and tmeta.get("source_clean") is True\n        and tmeta.get("axioms_verified") is True\n        and tmeta.get("formal_binding_verified") is True\n        and claim_hash_matches\n        and (expected_item_id is None or str(tmeta.get("item_id") or "") == str(expected_item_id))\n        and (expected_iteration is None or int(tmeta.get("iteration", -1)) == int(expected_iteration))\n    )\n    evidence_kind = bound_evidence.kind if bound_evidence is not None else "INCONCLUSIVE"\n    computation_ok = bool(\n        bound_evidence\n        and bound_evidence.ok\n        and evidence_kind\n        in {\n            "EXACT_PASS",\n            "EXHAUSTIVE_NO_SOLUTION",\n            "EXHAUSTIVE_OPTIMUM",\n            "NUMERICAL_PASS",\n        }\n    )\n    deterministic_counterexample = bool(\n        bound_evidence\n        and bound_evidence.ok\n        and evidence_kind == "DETERMINISTIC_COUNTEREXAMPLE"\n        and bound_evidence.witness is not None\n    )\n\n    verifier_counterexample = str(verifier.get("counterexample") or "").strip()\n    critic_counterexample = str(critic.get("counterexample") or "").strip()\n    llm_counterexample = verifier_counterexample or critic_counterexample\n    llm_refutation_candidate = bool(llm_counterexample) and not deterministic_counterexample\n\n    metadata = {\n        "formal_verified": formal_verified,\n        "formal_binding_verified": bool(tmeta.get("formal_binding_verified")),\n        "axioms_verified": bool(tmeta.get("axioms_verified")),\n        "source_clean": bool(tmeta.get("source_clean")),\n        "claim_hash_matches": claim_hash_matches,\n        "expected_claim_hash": expected_claim_hash,\n        "actual_claim_hash": str(tmeta.get("claim_hash") or ""),\n        "computation_ok": computation_ok,\n        "verifier_verdict": verifier_verdict,\n        "critic_verdict": critic_verdict,\n        "deterministic_counterexample": deterministic_counterexample,\n        "deterministic_counterexample_type": evidence_kind if deterministic_counterexample else "",\n        "llm_counterexample": llm_counterexample,\n        "llm_refutation_candidate": llm_refutation_candidate,\n        "expected_item_id": expected_item_id,\n        "expected_iteration": expected_iteration,\n        "evidence_kind": evidence_kind,\n        "evidence_hash": bound_evidence.evidence_hash if bound_evidence else "",\n        "source_origin": bound_evidence.source_origin if bound_evidence else "",\n        "evidence_role": bound_evidence.evidence_role if bound_evidence else "",\n        "resolution_scope": bound_evidence.resolution_scope if bound_evidence else "",\n    }\n\n    if deterministic_counterexample:\n        return GuardDecision(requested, "FAIL", "Deterministically verified counterexample evidence forces FAIL.", requested != "FAIL", metadata)\n\n    if llm_refutation_candidate:\n        return GuardDecision(\n            requested,\n            "REFUTATION_CANDIDATE",\n            "LLM-only counterexample is not deterministic evidence; keep it active until verified.",\n            requested != "REFUTATION_CANDIDATE",\n            metadata,\n        )\n\n    if requested == "PROVEN":\n        if formal_verified and verifier_verdict == "PASS" and critic_verdict != "KILL":\n            return GuardDecision(\n                requested,\n                "PROVEN",\n                "Bound Lean source passed the checker, claim-hash/source/axiom guards, verifier PASS, and critic did not KILL it.",\n                False,\n                metadata,\n            )\n        return GuardDecision(\n            requested,\n            "OPEN",\n            "PROVEN rejected: requires same-item/same-iteration/same-claim bound Lean evidence, clean source, verified axioms, verifier PASS, and critic not KILL.",\n            True,\n            metadata,\n        )\n\n    if requested == "PROOF_CANDIDATE":\n        if verifier_verdict == "PASS" and critic_verdict != "KILL":\n            return GuardDecision(requested, "PROOF_CANDIDATE", "Verifier PASS and critic did not KILL.", False, metadata)\n        return GuardDecision(requested, "OPEN", "PROOF_CANDIDATE rejected by verifier/critic guard.", True, metadata)\n\n    if requested == "COMPUTATION_PASS":\n        if computation_ok:\n            return GuardDecision(requested, "COMPUTATION_PASS", "Bound machine evidence justifies computation status.", False, metadata)\n        return GuardDecision(\n            requested,\n            "OPEN",\n            f"COMPUTATION_PASS rejected: evidence kind {evidence_kind} is not sufficient.",\n            True,\n            metadata,\n        )\n\n    if requested == "FAIL":\n        if critic_verdict == "KILL" or verifier_verdict == "FAIL":\n            return GuardDecision(\n                requested,\n                "DROPPED",\n                "No deterministic counterexample exists; negative LLM judgement alone cannot create mathematical FAIL.",\n                True,\n                metadata,\n            )\n        return GuardDecision(requested, "OPEN", "FAIL rejected: insufficient deterministic failure evidence.", True, metadata)\n\n    if requested == "REFUTATION_CANDIDATE":\n        return GuardDecision(\n            requested,\n            "REFUTATION_CANDIDATE",\n            "Refutation candidate remains active pending deterministic verification.",\n            False,\n            metadata,\n        )\n\n    if requested == "DROPPED":\n        return GuardDecision(requested, "DROPPED", "Manager explicitly closed the research direction.", False, metadata)\n\n    return GuardDecision(requested, "OPEN", "OPEN is always admissible.", requested != "OPEN", metadata)\n'''
          guard_path.write_text(guard, encoding="utf-8")

          engine_path = Path("lab/theorem_engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          if "from lab.evidence import" not in engine:
              engine = engine.replace(
                  "from lab.code_experiment_settings import load_code_experiment_settings, load_code_experiment_settings_from_dict\n",
                  "from lab.code_experiment_settings import load_code_experiment_settings, load_code_experiment_settings_from_dict\nfrom lab.evidence import evidence_from_tool_result, validate_evidence_binding\n",
                  1,
              )
          if "from lab.research_contract import ResearchContract" not in engine:
              engine = engine.replace(
                  "from lab.prompts import checkpoint_prompt, critic_prompt, literature_prompt, manager_prompt, proposal_prompt, verifier_prompt\n",
                  "from lab.prompts import checkpoint_prompt, critic_prompt, literature_prompt, manager_prompt, proposal_prompt, verifier_prompt\nfrom lab.research_contract import ResearchContract\n",
                  1,
              )
          old_tool = '''            request = proposal.get("tool_request")\n            tool_request = request if isinstance(request, dict) else None\n            tool_result = self._tool(tool_request, f"iter:{iteration}:tool")\n\n            verification = self._call_json(\n'''
          new_tool = '''            request = proposal.get("tool_request")\n            tool_request = request if isinstance(request, dict) else None\n            tool_result = self._tool(tool_request, f"iter:{iteration}:tool")\n            contract = ResearchContract.load_optional(self.state.root)\n            target_id = str(proposal.get("target_id") or "").strip() or None\n            bound_evidence = None\n            if tool_result is not None:\n                try:\n                    bound_evidence = evidence_from_tool_result(\n                        tool_result,\n                        request=tool_request,\n                        contract=contract,\n                        target_id=target_id,\n                    )\n                    bound_evidence = validate_evidence_binding(bound_evidence, contract=contract)\n                except (KeyError, ValueError) as exc:\n                    self.trace.log(\n                        "evidence_binding_rejected",\n                        iteration=iteration,\n                        item_id=item.id,\n                        target_id=target_id,\n                        error=str(exc),\n                    )\n                if bound_evidence is not None:\n                    self.trace.log(\n                        "tool_result_evidence",\n                        iteration=iteration,\n                        item_id=item.id,\n                        evidence_kind=bound_evidence.kind,\n                        evidence=bound_evidence.as_dict(),\n                    )\n\n            verification = self._call_json(\n'''
          if old_tool not in engine:
              raise SystemExit("tool execution anchor missing")
          engine = engine.replace(old_tool, new_tool, 1)
          old_guard = '''                expected_item_id=item.id,\n                expected_iteration=iteration,\n                expected_claim_hash=expected_claim_hash,\n            )\n'''
          new_guard = '''                expected_item_id=item.id,\n                expected_iteration=iteration,\n                expected_claim_hash=expected_claim_hash,\n                evidence=bound_evidence,\n                contract=contract,\n            )\n'''
          if old_guard not in engine:
              raise SystemExit("choose_status anchor missing")
          engine = engine.replace(old_guard, new_guard, 1)
          old_ce = '''            counterexample = str(verification.get("counterexample") or critique.get("counterexample") or "").strip()\n            tool_counterexample = bool(tool_result and tool_result.tool == "tropical_grid" and str((tool_result.metadata or {}).get("status") or "").upper() == "COUNTEREXAMPLE")\n            if status == "FAIL" and (tool_counterexample or counterexample):\n                existing = [x for x in self.state.list_items(kind="counterexample") if x.metadata.get("target_id") == item.id]\n                if not existing:\n                    desc = "Deterministic tropical grid counterexample" if tool_counterexample else counterexample\n                    counter = self.state.add_counterexample(item.id, desc, payload=(tool_result.metadata if tool_counterexample and tool_result else None))\n                    self.trace.log("state_change", action="counterexample", item_id=counter.id, target_id=item.id, kind="counterexample", status="KNOWN", detail=desc)\n            else:\n'''
          new_ce = '''            counterexample = str(verification.get("counterexample") or critique.get("counterexample") or "").strip()\n            deterministic_tool_counterexample = bool(\n                bound_evidence\n                and bound_evidence.kind == "DETERMINISTIC_COUNTEREXAMPLE"\n                and bound_evidence.witness is not None\n            )\n            if status == "FAIL" and (deterministic_tool_counterexample or counterexample):\n                existing = [x for x in self.state.list_items(kind="counterexample") if x.metadata.get("target_id") == item.id]\n                if not existing:\n                    desc = "Deterministically verified tool counterexample" if deterministic_tool_counterexample else counterexample\n                    payload = bound_evidence.witness if deterministic_tool_counterexample and bound_evidence else None\n                    counter = self.state.add_counterexample(item.id, desc, payload=payload)\n                    self.trace.log("state_change", action="counterexample", item_id=counter.id, target_id=item.id, kind="counterexample", status="KNOWN", detail=desc)\n            else:\n'''
          if old_ce not in engine:
              raise SystemExit("counterexample anchor missing")
          engine = engine.replace(old_ce, new_ce, 1)
          old_meta = '''                metadata: dict[str, Any] = {"status_guard": guard.metadata, "proposal_hash": item.metadata.get("proposal_hash")}\n'''
          new_meta = '''                metadata: dict[str, Any] = {\n                    "status_guard": guard.metadata,\n                    "proposal_hash": item.metadata.get("proposal_hash"),\n                }\n                if bound_evidence is not None:\n                    metadata["evidence"] = bound_evidence.as_dict()\n'''
          if old_meta not in engine:
              raise SystemExit("metadata anchor missing")
          engine = engine.replace(old_meta, new_meta, 1)
          engine_path.write_text(engine, encoding="utf-8")
          PY
      - name: Run evidence acceptance tests
        run: |
          python -m pip install -e ".[dev]"
          pytest -q tests/test_evidence.py tests/test_research_contract.py tests/test_proven_end_to_end.py tests/test_lean_gate.py tests/test_tropical_grid_semantics.py tests/test_refutation_status.py tests/test_z3_evidence.py
          ruff check lab/evidence.py lab/tools.py lab/status_guard.py lab/theorem_engine.py tests/test_evidence.py
          mypy lab/evidence.py lab/tools.py lab/status_guard.py lab/theorem_engine.py
      - name: Commit production evidence wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/tools.py lab/status_guard.py lab/theorem_engine.py
          git diff --cached --quiet && exit 0
          git commit -m "feat(evidence): enforce evidence semantics in run path"
          git push origin HEAD:feat/evidence-driven-core
