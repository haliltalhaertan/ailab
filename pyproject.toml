[project]
name = "llm-lab"
version = "0.2.0"
description = "Çok ajanlı, doğrulama ve araştırma hafızası destekli LLM araştırma laboratuvarı"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "httpx>=0.27",
    "z3-solver>=4.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]
