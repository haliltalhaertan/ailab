[project]
name = "llm-lab"
version = "0.3.0"
description = "Çok ajanlı, doğrulama ve araştırma hafızası destekli LLM araştırma laboratuvarı"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.36,<2",
    "httpx>=0.27,<1",
    "z3-solver>=4.13,<5",
    "psutil>=5.9,<8",
    "pandas>=2.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["research_state", "runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = false
