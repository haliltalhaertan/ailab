[project]
name = "llm-lab"
version = "0.1.0"
description = "Çok ajanlı LLM araştırma laboratuvarı"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]
